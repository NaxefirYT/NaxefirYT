<svg xmlns="http://www.w3.org/2000/svg" width="840" height="158" viewBox="0 0 840 158" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#12161d"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ffb63e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffb63e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8b29"/>
      <stop offset="60%" stop-color="#ffb63e"/>
      <stop offset="100%" stop-color="#957dff"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="dotFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask">
      <rect width="840" height="158" fill="url(#dotFade)"/>
    </mask>
    <clipPath id="clip">
      <rect x="0.5" y="0.5" width="839" height="157" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="0.5" y="0.5" width="839" height="157" rx="14" fill="url(#bg)"/>
    <rect width="840" height="158" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="840" height="158" fill="url(#glow)"/>
    <rect x="0" y="0" width="840" height="2.5" fill="url(#accentBar)" fill-opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="157" rx="14" stroke="#2b313c" stroke-width="1"/>

  <text x="34" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.6" fill="#f0f3f6">Naxefir</text>

  <text x="34" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca6b4">Пишу на C# и C — моды, плагины и утилиты для игр.</text>
  <text x="34" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca6b4">Сейчас пилю редактор KFWE для Warcraft III и сервер MANGO по SCP:SL.</text>
<rect x="574" y="28" width="234" height="102" rx="10" fill="#0f1319" stroke="#262c36" stroke-width="1"/>
  <text x="590" y="49" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.9" fill="#727c8c">В РАБОТЕ</text>
  <line x1="590" y1="59" x2="792" y2="59" stroke="#222731" stroke-width="1"/>

  <circle cx="595" cy="79" r="3.2" fill="#957dff"/>
  <text x="606" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="600" fill="#f0f3f6">KFWE</text>
  <text x="792" y="83" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#727c8c">Warcraft III</text>

  <line x1="590" y1="96" x2="792" y2="96" stroke="#222731" stroke-width="1"/>

  <circle cx="595" cy="113" r="3.2" fill="#ffb63e"/>
  <text x="606" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="600" fill="#f0f3f6">MANGO</text>
  <text x="792" y="117" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#727c8c">SCP:SL · LabAPI</text>
</svg>
